<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic QA - Demo Shop</title>
<style>
  :root { --ink:#1c2333; --muted:#5b6478; --line:#dfe3ea; --accent:#2f6fed; --bg:#f6f7fb; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header strong { font-size:16px; }
  nav a { color:var(--muted); text-decoration:none; margin-right:14px; }
  nav a:hover { color:var(--accent); }
  main { max-width:900px; margin:24px auto; padding:0 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  input, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  button.secondary { background:#fff; color:var(--ink); border-color:var(--line); }
  button:disabled { opacity:.6; cursor:not-allowed; }
  label { display:block; margin:10px 0 4px; font-size:13px; color:var(--muted); }
  .error { color:#b42318; margin-top:10px; }
  .muted { color:var(--muted); }
  .toast { position:fixed; right:20px; bottom:20px; background:#111; color:#fff; padding:10px 14px; border-radius:8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  .total-row { font-weight:600; }
</style>
</head>
<body>
<header>
  <strong>Demo Shop</strong>
  <nav>
    <a href="#/products">Products</a>
    <a href="#/cart" data-testid="nav-cart">Cart</a>
    <a href="#/orders">Orders</a>
  </nav>
  <span id="who" class="muted" style="margin-left:auto"></span>
</header>
<main id="view"></main>

<script>
(function () {
  'use strict';

  const state = {
    token: localStorage.getItem('token') || '',
    user: null,
    activeBugs: [],
    lastOrder: null,
  };

  const view = document.getElementById('view');

  function bugsOn(id) { return state.activeBugs.includes(id); }

  async function api(path, options) {
    const opts = Object.assign({ headers: {} }, options || {});
    opts.headers['Content-Type'] = 'application/json';
    if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
    const res = await fetch(path, opts);
    let body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    if (!res.ok) {
      const err = new Error((body && body.error) || 'request failed');
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return body;
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function money(n) {
    if (typeof n !== 'number') return '$0.00';
    // BUG-15: keeps three decimals on money values.
    if (bugsOn('BUG-15') && !Number.isInteger(n)) return '$' + n.toFixed(3);
    return '$' + n.toFixed(2);
  }

  function toast(message) {
    const old = document.querySelector('[data-testid=toast]');
    if (old) old.remove();
    const node = el('<div class="toast" data-testid="toast"></div>');
    node.textContent = message;
    document.body.appendChild(node);
    setTimeout(function () { node.remove(); }, 2000);
  }

  async function loadBugs() {
    try {
      const res = await fetch('/api/__bugs');
      const body = await res.json();
      state.activeBugs = body.active || [];
    } catch (e) { state.activeBugs = []; }
  }

  /* ------------------------------ views ------------------------------ */

  function renderLogin() {
    view.innerHTML = '';
    const form = el(
      '<form class="card" style="max-width:380px" autocomplete="off">' +
        '<h2 style="margin-top:0">Sign in</h2>' +
        '<label for="login-email">Email</label>' +
        '<input id="login-email" data-testid="login-email" type="email" style="width:100%" />' +
        '<label for="login-password">Password</label>' +
        '<input id="login-password" data-testid="login-password" type="password" style="width:100%" />' +
        '<div style="margin-top:14px"><button type="submit" data-testid="login-submit">Sign in</button></div>' +
        '<div class="error" data-testid="login-error" role="alert"></div>' +
        '<p class="muted" style="font-size:13px">Demo account: demo@shop.test / demo1234</p>' +
      '</form>'
    );
    view.appendChild(form);

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const errorBox = form.querySelector('[data-testid=login-error]');
      errorBox.textContent = '';
      try {
        const body = await api('/api/login', {
          method: 'POST',
          body: JSON.stringify({
            email: form.querySelector('[data-testid=login-email]').value,
            password: form.querySelector('[data-testid=login-password]').value,
          }),
        });
        state.token = body.token;
        state.user = body.user;
        localStorage.setItem('token', body.token);
        renderWho();
        location.hash = '#/products';
      } catch (err) {
        errorBox.textContent = err.message;
        if (err.body && err.body.detail) errorBox.textContent += ' ' + err.body.detail;
      }
    });
  }

  async function renderProducts() {
    view.innerHTML = '<div class="card">Loading products...</div>';
    const wrap = el('<div></div>');
    const bar = el(
      '<div class="row card">' +
        '<input data-testid="search-input" placeholder="Search products" style="flex:1" />' +
        '<span class="muted" id="count"></span>' +
      '</div>'
    );
    const grid = el('<div class="grid"></div>');
    wrap.appendChild(bar);
    wrap.appendChild(grid);
    view.innerHTML = '';
    view.appendChild(wrap);

    async function load(q) {
      grid.innerHTML = '<div class="card">Loading...</div>';
      try {
        const body = await api('/api/products' + (q ? '?q=' + encodeURIComponent(q) : ''));
        document.getElementById('count').textContent = body.items.length + ' items';
        grid.innerHTML = '';
        if (!body.items.length) grid.innerHTML = '<div class="card muted">No products found.</div>';
        body.items.forEach(function (product) {
          const card = el(
            '<div class="card" data-testid="product-card" data-product-id="' + product.id + '">' +
              '<div class="row"><strong></strong><span class="muted"></span></div>' +
              '<p class="muted" style="font-size:13px;margin:6px 0"></p>' +
              '<div class="row"><span class="price"></span>' +
              '<button data-testid="add-to-cart" data-product-id="' + product.id + '">Add to cart</button></div>' +
            '</div>'
          );
          card.querySelector('strong').textContent = product.name;
          card.querySelector('.muted').textContent = product.stock > 0 ? 'In stock' : 'Out of stock';
          card.querySelector('p').textContent = product.category;
          card.querySelector('.price').textContent = money(product.price);

          const button = card.querySelector('[data-testid=add-to-cart]');
          button.addEventListener('click', async function () {
            button.disabled = true;
            // BUG-05: random delay before the button becomes usable.
            if (bugsOn('BUG-05')) {
              const delay = 500 + Math.round(Math.random() * 1200);
              await new Promise(function (r) { setTimeout(r, delay); });
            }
            try {
              await api('/api/cart', {
                method: 'POST',
                body: JSON.stringify({ productId: product.id, qty: 1 }),
              });
              toast('Added ' + product.name);
            } catch (err) {
              toast(err.message);
            } finally {
              button.disabled = false;
            }
          });
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = '';
        grid.appendChild(el('<div class="card error">Could not load products: ' + err.message + '</div>'));
      }
    }

    bar.querySelector('[data-testid=search-input]').addEventListener('input', function (event) {
      load(event.target.value.trim());
    });

    await load('');
  }

  async function renderCart() {
    view.innerHTML = '<div class="card">Loading cart...</div>';
    let cart;
    try {
      cart = await api('/api/cart');
    } catch (err) {
      view.innerHTML = '';
      view.appendChild(el('<div class="card error">Could not load cart: ' + err.message + '</div>'));
      return;
    }

    view.innerHTML = '';
    const card = el(
      '<div class="card">' +
        '<h2 style="margin-top:0">Your cart</h2>' +
        '<table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr></thead><tbody></tbody></table>' +
        '<div class="row" style="margin-top:14px"><span>Subtotal</span><span data-testid="cart-subtotal"></span></div>' +
        '<div class="row"><span>Tax</span><span data-testid="cart-tax"></span></div>' +
        '<div class="row total-row"><span>Total</span><span data-testid="cart-total"></span></div>' +
        '<div class="row" style="margin-top:14px"><a href="#/products" class="muted">Keep shopping</a>' +
        '<button data-testid="checkout-button"></button></div>' +
      '</div>'
    );

    const tbody = card.querySelector('tbody');
    if (!cart.items.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="muted">Your cart is empty.</td></tr>';
    }

    cart.items.forEach(function (item) {
      const row = el(
        '<tr data-testid="cart-row" data-product-id="' + item.productId + '">' +
          '<td class="name"></td>' +
          '<td><input data-testid="qty-input" type="number" min="0" style="width:70px" /></td>' +
          '<td class="line-price"></td>' +
          '<td><button class="secondary" data-testid="remove-item">Remove</button></td>' +
        '</tr>'
      );
      row.querySelector('.name').textContent = item.name;
      row.querySelector('[data-testid=qty-input]').value = item.qty;
      row.querySelector('.line-price').textContent = money(item.price * item.qty);

      row.querySelector('[data-testid=qty-input]').addEventListener('change', async function (event) {
        try {
          await api('/api/cart/' + item.productId, {
            method: 'PATCH',
            body: JSON.stringify({ qty: Number(event.target.value) }),
          });
          renderCart();
        } catch (err) {
          toast(err.message);
          renderCart();
        }
      });

      row.querySelector('[data-testid=remove-item]').addEventListener('click', async function () {
        try {
          await api('/api/cart/' + item.productId, { method: 'DELETE' });
          renderCart();
        } catch (err) {
          toast(err.message);
        }
      });

      tbody.appendChild(row);
    });

    card.querySelector('[data-testid=cart-subtotal]').textContent = money(cart.subtotal);
    card.querySelector('[data-testid=cart-tax]').textContent = money(cart.tax);
    card.querySelector('[data-testid=cart-total]').textContent = money(cart.total);

    const checkoutButton = card.querySelector('[data-testid=checkout-button]');
    // BUG-06: the button label changes, breaking label-based locators.
    checkoutButton.textContent = bugsOn('BUG-06') ? 'Proceed to payment' : 'Checkout';
    checkoutButton.addEventListener('click', function () { location.hash = '#/checkout'; });

    view.appendChild(card);
  }

  async function renderCheckout() {
    view.innerHTML = '<div class="card">Loading checkout...</div>';
    let cart;
    try {
      cart = await api('/api/cart');
    } catch (err) {
      view.innerHTML = '';
      view.appendChild(el('<div class="card error">Could not load cart: ' + err.message + '</div>'));
      return;
    }

    view.innerHTML = '';
    const card = el(
      '<div class="card" style="max-width:520px">' +
        '<h2 style="margin-top:0">Checkout</h2>' +
        '<div class="row"><span>Subtotal</span><span data-testid="checkout-subtotal"></span></div>' +
        '<div class="row"><span>Tax</span><span data-testid="checkout-tax"></span></div>' +
        '<label for="discount-code">Discount code</label>' +
        '<input id="discount-code" data-testid="discount-code" placeholder="SAVE10" />' +
        '<div class="row total-row" style="margin-top:12px"><span>Total</span><span data-testid="order-total"></span></div>' +
        '<div style="margin-top:14px"><button data-testid="place-order">Place order</button></div>' +
        '<div class="error" data-testid="checkout-error" role="alert"></div>' +
      '</div>'
    );
    card.querySelector('[data-testid=checkout-subtotal]').textContent = money(cart.subtotal);
    card.querySelector('[data-testid=checkout-tax]').textContent = money(cart.tax);
    card.querySelector('[data-testid=order-total]').textContent = money(cart.total);

    card.querySelector('[data-testid=place-order]').addEventListener('click', async function () {
      const errorBox = card.querySelector('[data-testid=checkout-error]');
      errorBox.textContent = '';
      try {
        const body = await api('/api/checkout', {
          method: 'POST',
          body: JSON.stringify({ discountCode: card.querySelector('[data-testid=discount-code]').value }),
        });
        state.lastOrder = body.order;
        renderConfirmation(body.order);
      } catch (err) {
        errorBox.textContent = err.message;
      }
    });

    view.appendChild(card);
  }

  function renderConfirmation(order) {
    view.innerHTML = '';
    const card = el(
      '<div class="card" data-testid="order-confirmation">' +
        '<h2 style="margin-top:0">Order placed</h2>' +
        '<p class="muted">Order <strong class="order-id"></strong></p>' +
        '<div class="row"><span>Subtotal</span><span class="subtotal"></span></div>' +
        '<div class="row"><span>Tax</span><span class="tax"></span></div>' +
        '<div class="row"><span>Discount</span><span class="discount"></span></div>' +
        '<div class="row total-row"><span>Total paid</span><span class="total"></span></div>' +
        '<p style="margin-top:16px"><a href="#/orders">View orders</a></p>' +
      '</div>'
    );
    card.querySelector('.order-id').textContent = order.id;
    card.querySelector('.subtotal').textContent = money(order.subtotal);
    card.querySelector('.tax').textContent = money(order.tax);
    card.querySelector('.discount').textContent = money(order.discount);
    card.querySelector('.total').textContent = money(order.total);
    view.appendChild(card);
  }

  async function renderOrders() {
    view.innerHTML = '<div class="card">Loading orders...</div>';
    let body;
    try {
      body = await api('/api/orders');
    } catch (err) {
      view.innerHTML = '';
      view.appendChild(el('<div class="card error">Could not load orders: ' + err.message + '</div>'));
      return;
    }

    view.innerHTML = '';
    const card = el(
      '<div class="card"><h2 style="margin-top:0">Orders</h2><div class="list"></div></div>'
    );
    const list = card.querySelector('.list');
    if (!body.items.length) list.appendChild(el('<p class="muted">No orders yet.</p>'));
    body.items.forEach(function (order) {
      const row = el(
        '<div class="row" data-testid="order-row" data-order-id="' + order.id + '" style="border-bottom:1px solid #dfe3ea;padding:10px 0">' +
          '<div><strong class="oid"></strong><div class="muted" style="font-size:13px"></div></div>' +
          '<span class="amount"></span>' +
        '</div>'
      );
      row.querySelector('.oid').textContent = order.id;
      row.querySelector('.muted').textContent = order.items.length + ' item(s) - ' + order.createdAt.slice(0, 10);
      row.querySelector('.amount').textContent = money(order.total);
      list.appendChild(row);
    });
    view.appendChild(card);
  }

  function renderWho() {
    document.getElementById('who').textContent = state.user ? state.user.name : '';
  }

  /* ----------------------------- router ------------------------------ */

  function route() {
    const hash = location.hash || '#/products';
    if (!state.token && hash !== '#/login') { location.hash = '#/login'; return; }
    if (state.token && hash === '#/login') { location.hash = '#/products'; return; }

    if (hash === '#/login') return renderLogin();
    if (hash === '#/products') return renderProducts();
    if (hash === '#/cart') return renderCart();
    if (hash === '#/checkout') return renderCheckout();
    if (hash === '#/orders') return renderOrders();
    return renderProducts();
  }

  async function boot() {
    await loadBugs();
    if (state.token) {
      try { await api('/api/cart'); } catch (e) { state.token = ''; localStorage.removeItem('token'); }
    }
    renderWho();
    window.addEventListener('hashchange', route);
    route();
  }

  boot();
})();
</script>
</body>
</html>
